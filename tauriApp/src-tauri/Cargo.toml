[package]
name = "craftdice"
version = "0.1.0"
description = "CraftDice desktop game"
authors = ["Koke"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "craftdice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tempfile = "3"
serde_json = "1"
